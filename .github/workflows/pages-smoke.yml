name: PDF HDV Pages smoke checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  pages-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check static HTML and browser PDF fallback
        run: node --test tests/pages-smoke.test.cjs tests/home-layout.test.cjs tests/home-legal.test.cjs tests/cit-advanced.test.cjs tests/cit-advanced-ui.test.cjs tests/rich-native.test.cjs tests/batch-text.test.cjs tests/native-text.test.cjs tests/text-layout.test.cjs tests/text-editor-route.test.cjs tests/hvd-cit-hub.test.cjs

name: PDF EDITOR Live Startup Diagnostic
on:
  push:
    branches: [master]
    paths:
      - 'tests/studio-startup-live.cjs'
      - 'tests/studio-file-open-regression.cjs'
      - 'studio/hvd-text-apply.js'
      - 'studio/hvd-text-apply.css'
      - 'studio/sw.js'
      - 'studio/edit-pdf-text.html'
      - '.github/workflows/studio-startup-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Inspect production startup with and without Service Worker
        run: node tests/studio-startup-live.cjs
      - name: Exercise visible file chooser and drag-and-drop on live Pages
        run: node tests/studio-file-open-regression.cjs
      - name: Upload real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-diagnostics
          path: |
            test-results/studio-startup/
            test-results/file-open-regression/
          if-no-files-found: ignore

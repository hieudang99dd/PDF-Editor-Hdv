name: CIT Source Sync — pinned PDFium text editor
on:
  push:
    branches: [master]
    paths:
      - 'scripts/cit-original/**'
      - 'tests/studio-text-sync-browser.cjs'
      - 'tests/cit-pdfjs-timeout.test.cjs'
      - 'tests/local-bridge.test.cjs'
      - 'tests/text-editor-asset-paths.cjs'
      - 'studio/hvd-text-apply.js'
      - 'studio/hvd-text-apply.css'
      - '.github/workflows/cit-original-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cit-text-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current PDF Đạo Chích
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact cit-pdf 1.0.0 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch 1.0.0 --depth 1 https://github.com/Cuongyd196/cit-pdf.git cit-upstream
          test "$(git -C cit-upstream rev-parse HEAD)" = "3c9c138d980a417de7439f383f37882a1d730ab6"
      - name: Apply reviewed source patch to native CIT only
        run: python3 scripts/cit-original/patch_source.py cit-upstream
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cit-upstream/package-lock.json
      - name: Install pinned CIT dependencies
        working-directory: cit-upstream
        env:
          HUSKY: '0'
        run: npm ci --no-audit --no-fund
      - name: Type-check CIT sources
        working-directory: cit-upstream
        run: npx tsc --noEmit
      - name: Build local-path PDFium frontend
        working-directory: cit-upstream
        env:
          BASE_URL: /PDF-Editor1/studio/
          VITE_USE_CDN: 'false'
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx vite build
      - name: Verify upstream native PDFium assets and correct Pages base
        run: python3 scripts/cit-original/verify_build.py cit-upstream/dist
      - name: Sync only text editor dependencies; retain approved HTML and other tools
        run: python3 scripts/cit-original/sync_text_build.py cit-upstream/dist .
      - name: Static regression checks and syntax validation
        run: |
          node --check studio/hvd-text-apply.js
          node tests/text-editor-asset-paths.cjs
          node --test tests/*.test.cjs
      - name: Install Chromium browser acceptance runtime
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Edit and export a real PDF through locally built text UI
        run: node tests/studio-text-sync-browser.cjs
      - name: Independently validate native PDF text replacement
        run: |
          python3 -m pip install --user --break-system-packages 'pymupdf>=1.24,<2'
          python3 scripts/cit-original/verify_pdf.py test-results/cit-original/source.pdf test-results/cit-original/cit-edited.pdf
      - name: Publish only if remote master is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- studio/assets studio/edit-pdf-text.html studio/hvd-text-build.json
          if git diff --cached --quiet; then
            echo 'Native CIT editor already synchronized.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(text): publish validated CIT source edit engine"
          git fetch origin master
          if [[ "$(git rev-parse origin/master)" != "$(git rev-parse HEAD^)" ]]; then
            echo "::error title=Concurrent change::master advanced during QA; rejecting stale generated assets"
            exit 1
          fi
          git push origin HEAD:master
      - name: Save browser evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cit-native-text-sync-evidence
          path: test-results/cit-original/
          if-no-files-found: ignore

name: CIT Original Frontend Build QA
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/cit-original-build.yml"
      - "scripts/cit-original/**"
      - "tests/cit-original-browser.cjs"
      - 'index.html'
      - 'text-editor.html'
      - 'text-editor-shell.js'
      - 'text-editor.css'
      - 'organizer.js'
      - 'pdf-native-*.mjs'
      - 'pdf-text-layout.js'
      - 'pdf-batch-text.js'
      - 'cit-advanced-*.js'
      - 'pdf-local-tools.js'
      - 'vendor/**'
      - 'fonts/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cit-original-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    environment:
      name: github-pages
      url: https://hieudang99dd.github.io/PDF-Editor-Hdv/
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout HVD
        uses: actions/checkout@v4
      - name: Validate HVD brand-only transformation and copyright preservation
        run: python3 -m unittest discover -s tests -p 'test_brand_site.py' -v
      - name: Checkout exact CIT-PDF v1.0.0 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch 1.0.0 --depth 1 --filter=blob:none https://github.com/Cuongyd196/cit-pdf.git cit-upstream
          actual="$(git -C cit-upstream rev-parse HEAD)"
          expected="3c9c138d980a417de7439f383f37882a1d730ab6"
          echo "CIT source: $actual"
          test "$actual" = "$expected"
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cit-upstream/package-lock.json
      - name: Install exact CIT dependencies
        working-directory: cit-upstream
        env:
          HUSKY: '0'
        run: npm ci --no-audit --no-fund
      - name: Compile ORIGINAL CIT frontend and WASM assets
        working-directory: cit-upstream
        env:
          BASE_URL: /PDF-Editor-Hdv/cit-native/
          VITE_USE_CDN: 'false'
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npx vite build
          test -s dist/edit-pdf-text.html
          test -d dist/assets
          echo "CIT built source summary:"
          du -sh dist
          ls -lh dist/edit-pdf-text.html
      - name: Validate route and built dependencies
        shell: bash
        run: |
          python3 scripts/cit-original/verify_build.py cit-upstream/dist
      - name: Assemble final HVD Pages site with original CIT frontend
        shell: bash
        run: |
          python3 scripts/cit-original/publish_site.py cit-upstream/dist cit-stage
          test -s cit-stage/text-editor.html
          test -s cit-stage/text-editor-hdv.html
          grep -q 'text-editor-shell.js' cit-stage/text-editor-hdv.html
          if grep -q 'location.replace("./cit-native/edit-pdf-text.html"' cit-stage/text-editor-hdv.html; then
            echo 'BUG: fallback editor was replaced with the CIT redirect'
            exit 1
          fi
          test -s cit-stage/cit-native/edit-pdf-text.html
          grep -q 'hvd-hub.js' cit-stage/cit-native/edit-pdf-text.html
          grep -q 'hvd-hub.css' cit-stage/cit-native/edit-pdf-text.html
          test -s cit-stage/cit-native/hvd-hub.js
          test -s cit-stage/cit-native/hvd-hub.css
          test -s cit-stage/cit-native/hvd-mark.svg
          test -s cit-stage/cit-native/hvd-site.webmanifest
          grep -q 'PDF HVD – Chỉnh sửa văn bản' cit-stage/cit-native/edit-pdf-text.html
          if grep -q 'BentoPDF</title>' cit-stage/cit-native/edit-pdf-text.html; then
            echo "Old product name remains in browser title"
            exit 1
          fi
      - name: Install browser acceptance tools
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Real PDF text editing in original CIT Chromium UI
        timeout-minutes: 6
        run: node tests/cit-original-browser.cjs
      - name: Cross-validate actual CIT PDF glyph changes with PyMuPDF
        run: |
          python3 -m pip install --user --break-system-packages 'pymupdf>=1.24,<2'
          python3 scripts/cit-original/verify_pdf.py test-results/cit-original/source.pdf test-results/cit-original/cit-edited.pdf
      - name: Upload UI screenshots and edited PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cit-original-browser-evidence
          path: test-results/cit-original/
          if-no-files-found: ignore
      - name: Upload native frontend bundle for publication
        uses: actions/upload-artifact@v4
        with:
          name: cit-original-frontend-1.0.0
          path: cit-upstream/dist/
          retention-days: 7
          if-no-files-found: error
      - name: Persist original CIT compiled frontend to master for legacy Pages durability
        shell: bash
        run: |
          set -euo pipefail
          # The repository is currently also published by the legacy master
          # workflow. Persisting generated assets prevents a subsequent
          # unrelated commit from reverting the online frontend.
          mkdir -p cit-native
          rsync -a --delete cit-stage/cit-native/ cit-native/
          test -s cit-stage/cit-native/hvd-hub.js
          test -s cit-stage/text-editor-hdv.html
          if ! grep -q 'cit-native/edit-pdf-text.html' text-editor.html; then
            cp text-editor.html text-editor-hdv.html
          fi
          cp cit-stage/text-editor.html text-editor.html
          touch .nojekyll
          git add -A cit-native text-editor.html text-editor-hdv.html .nojekyll
          if git diff --cached --quiet; then
            echo "Original CIT bundle already matches the repository."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(cit): vendor exact original CIT-PDF 1.0.0 frontend distribution"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - name: Confirm Pages tree contains HVD and CIT original engine
        shell: bash
        run: |
          test -s cit-stage/index.html
          test -s cit-stage/text-editor.html
          test -s cit-stage/text-editor-hdv.html
          test -s cit-stage/cit-native/edit-pdf-text.html
          test -d cit-stage/cit-native/assets
          test -e cit-stage/.nojekyll
          du -sh cit-stage
      # GitHub Pages already deploys the master branch when the bot commits
      # the vetted distribution. Do not run a second concurrent Pages
      # deployment here: it races and can overwrite a newer branch release.

name: PDF Đạo Chích LIVE Text Editor Chromium
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/studio-live-browser.yml'
      - 'tests/studio-live-browser.cjs'
      - 'studio/edit-pdf-text.html'
      - 'studio/hvd-brand.css'
      - 'studio/sw.js'
      - 'studio/assets/main-DwO0x_KA.js'
      - 'studio/assets/lucide-DZsz3ibU.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Wait for matching deployed Pages JavaScript
        shell: bash
        run: |
          set -euo pipefail
          desired="$(sha256sum studio/assets/main-DwO0x_KA.js | awk '{print $1}')"
          ready=0
          for i in {1..18}; do
            url="https://hieudang99dd.github.io/PDF-Editor1/studio/assets/main-DwO0x_KA.js?deploy_probe=$i"
            actual="$(curl --retry 2 --fail --silent --show-error --location "$url" | sha256sum | awk '{print $1}')" || actual=""
            if [[ "$actual" == "$desired" ]]; then ready=1; break; fi
            echo "Waiting for updated Pages asset ($i/18)"
            sleep 10
          done
          test "$ready" -eq 1
      - name: Exercise actual Pages text editor and export
        run: node tests/studio-live-browser.cjs
      - name: Independently verify edited glyphs in exported PDF
        run: |
          python3 -m pip install --user --break-system-packages 'pymupdf>=1.24,<2'
          python3 - <<'PY'
          import fitz
          p='test-results/studio-live/live-edited.pdf'
          with fitz.open(p) as doc:
              assert len(doc)==1, f'Unexpected page count: {len(doc)}'
              text='\n'.join(page.get_text() for page in doc)
          assert 'PDF DAO CHICH EDITED' in text, 'New text missing from exported PDF: '+repr(text)
          assert 'PDF DAO CHICH ORIGINAL' not in text, 'Old text still embedded: '+repr(text)
          assert 'ANOTHER TEXT LINE' in text, 'Neighbor text was lost: '+repr(text)
          print('PASS PyMuPDF: actual edited glyphs, old glyphs absent, neighbor preserved')
          PY
      - name: Upload visual evidence and exported PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-dao-chich-live-editor-evidence
          path: test-results/studio-live/
          if-no-files-found: ignore

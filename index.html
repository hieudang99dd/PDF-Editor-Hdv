<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bộ công cụ PDF trực tuyến</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1a1f36;--mute:#667085;--line:#e1e5ee;--acc:#e8453c;--accs:#fdeceb;--navy:#1a1f36;--ok:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c2f;--ink:#eceef8;--mute:#9aa1bd;--line:#2a3050;--acc:#ff6a61;--accs:#3a1f27;--navy:#090b16}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c2f;--ink:#eceef8;--mute:#9aa1bd;--line:#2a3050;--acc:#ff6a61;--accs:#3a1f27;--navy:#090b16}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:20px;padding:12px 5vw;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .logo{font-weight:800;font-size:19px;cursor:pointer;background:none;border:0;color:#fff;padding:0}
header nav{display:flex;gap:4px;flex:1;overflow-x:auto}
header nav button{background:none;border:0;color:#cfd3e6;padding:6px 10px;border-radius:6px;white-space:nowrap}header nav button:hover{background:#ffffff1a;color:#fff}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;background:var(--acc);color:#fff}.btn:hover{filter:brightness(1.08)}
.btn.g{background:none;border:1px solid var(--line);color:var(--ink)}
.hero{padding:72px 5vw 40px;max-width:1100px;margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center}
.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.2;margin:0 0 16px;max-width:800px;letter-spacing:-0.02em}
.hero p{color:var(--mute);margin:0 0 32px;max-width:600px;font-size:16px}
.search{display:flex;gap:8px;width:100%;max-width:640px}.search input{flex:1;padding:14px 20px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;box-shadow:0 4px 24px rgba(0,0,0,0.04);transition:border-color .2s}
.wrap{max-width:1200px;margin:auto;padding:0 5vw 64px}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0 32px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:24px;padding:8px 18px;color:var(--mute);transition:all .2s;font-weight:500}.chip:hover{background:var(--line);color:var(--ink)}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2.cat{font-size:20px;margin:32px 0 16px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;display:flex;gap:16px;align-items:flex-start;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,0.02)}
.tool:hover{border-color:var(--acc);box-shadow:0 6px 16px rgba(0,0,0,0.06);transform:translateY(-2px)}
.ic{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:16px}
.tool b{display:block;font-size:15px;margin-bottom:4px;color:var(--ink)}.tool span{color:var(--mute);font-size:13px;line-height:1.4;display:block}

footer{padding:24px 5vw;color:var(--mute);font-size:13px;text-align:center}
/* workspace */
#ws{display:none;max-width:860px;margin:auto;padding:28px 5vw 48px}
.back{background:none;border:0;color:var(--mute);padding:0;margin-bottom:12px}
#ws h1{margin:0 0 4px;font-size:28px}#ws .d{color:var(--mute);margin:0 0 18px}
.drop{border:2px dashed var(--line);border-radius:12px;background:var(--card);padding:40px 20px;text-align:center}
.drop.hov{border-color:var(--acc);background:var(--accs)}.drop p{margin:8px 0 0;color:var(--mute);font-size:13px}
.files{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.files li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.files .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.files .s{color:var(--mute);font-size:12px}
.files button{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.opts{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0;display:grid;gap:12px}
.opts label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.opts input[type=text],.opts input[type=password],.opts select{padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.opts .r{display:flex;gap:14px;flex-wrap:wrap}.opts .r label{display:flex;gap:6px;align-items:center;color:var(--ink)}
canvas{width:100%;height:150px;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 6px}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
.res{background:var(--card);border:1px solid var(--ok);border-radius:10px;padding:16px;margin-top:14px}
.res b{color:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <button class="logo" id="logo">PDF Hub</button>
  <nav id="nav"></nav>
  <button class="btn g" id="theme" style="color:#fff;border-color:#ffffff40">◐</button>
  <button class="btn" id="refresh-app" style="background:#4a5568">Làm mới</button>
</header>

<main id="home">
  <section class="hero">
    <h1>Xử lý PDF dễ hơn, chỉ vài thao tác.</h1>
    <p>Nén, chuyển đổi, ghép, chỉnh sửa, ký tên và bảo vệ tài liệu ở cùng một nơi.</p>
    <div class="search"><input id="q" type="search" placeholder="Tìm công cụ, ví dụ: nén, Word, ký…" aria-label="Tìm công cụ"></div>
  </section>
  <div class="wrap"><div class="chips" id="chips"></div><div id="tools"></div></div>

  <footer>Toàn bộ quá trình xử lý PDF diễn ra ngay trên trình duyệt của bạn. Các tính năng gắn nhãn "Sắp ra mắt" đang được phát triển.</footer>
</main>

<main id="ws">
  <button class="back" id="back">← Tất cả công cụ</button>
  <h1 id="wt"></h1><p class="d" id="wd"></p>
  <div id="stage"></div>
</main>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),C={'Nén':'#e8453c','Chuyển đổi':'#2f6fed','Sắp xếp':'#7a4fd6','Chỉnh sửa':'#0f9d8a','Ký & Bảo vệ':'#d98a00','AI PDF':'#c2388f','Quét':'#4a5568'};
// [tên, mô tả, nhóm, biểu tượng, kiểu tùy chọn, loại tệp]
const T=[
['Giảm dung lượng PDF','Giảm kích cỡ tệp mà vẫn giữ chất lượng','Nén','⇲','compress','.pdf'],
['Chuyển đổi PDF','Đổi PDF sang nhiều định dạng khác','Chuyển đổi','⇄','fmt','.pdf'],
['PDF OCR','Nhận dạng chữ trên bản quét thành văn bản','Chuyển đổi','OCR','lang','.pdf'],
['PDF sang PDF/A','Chuẩn lưu trữ lâu dài','Chuyển đổi','A','none','.pdf'],
['PDF sang JPG','Tách mỗi trang thành ảnh JPG','Chuyển đổi','JPG','none','.pdf'],
['PDF sang PNG','Tách mỗi trang thành ảnh PNG','Chuyển đổi','PNG','none','.pdf'],
['JPG sang PDF','Đổi JPG, PNG, BMP, GIF, TIFF sang PDF','Chuyển đổi','▣','img','image/*'],
['PDF sang Word','Tạo tài liệu Word có thể sửa','Chuyển đổi','W','none','.pdf'],
['PDF sang Excel','Trích bảng thành bảng tính','Chuyển đổi','X','none','.pdf'],
['PDF sang PPT','Đổi trang thành slide','Chuyển đổi','P','none','.pdf'],
['Word sang PDF','Đổi DOC, DOCX sang PDF','Chuyển đổi','W','none','.doc,.docx'],
['Excel sang PDF','Đổi XLS, XLSX sang PDF','Chuyển đổi','X','none','.xls,.xlsx'],
['PPT sang PDF','Đổi PPT, PPTX sang PDF','Chuyển đổi','P','none','.ppt,.pptx'],
['TXT, RTF, HTML, EPUB, CSV sang PDF','Đổi nhiều định dạng văn bản sang PDF','Chuyển đổi','T','none','.txt,.rtf,.html,.epub,.csv'],
['Ghép PDF','Gộp nhiều tệp thành một','Sắp xếp','⊕','merge','.pdf'],
['Cắt PDF','Tách tệp theo khoảng trang','Sắp xếp','✂','range','.pdf'],
['Xoay PDF','Xoay toàn bộ hoặc từng trang','Sắp xếp','⟳','rot','.pdf'],
['Xóa trang PDF','Bỏ các trang không cần','Sắp xếp','🗑','range','.pdf'],
['Trích xuất trang','Lấy riêng một số trang','Sắp xếp','⇥','range','.pdf'],
['Sắp xếp PDF','Kéo thả để đổi thứ tự trang','Sắp xếp','☰','organize','.pdf'],
['Chỉnh sửa PDF','Sắp xếp, xoay, xóa, chèn trang (Thêm chữ/ảnh sắp ra mắt)','Chỉnh sửa','✎','organize','.pdf'],
['Trình chú thích PDF','Tô sáng, gạch chân, vẽ tay','Chỉnh sửa','▬','none','.pdf'],
['Trình đọc PDF','Xem và tìm kiếm trong tài liệu','Chỉnh sửa','👁','none','.pdf'],
['Đánh số trang','Thêm số trang vào chân trang','Chỉnh sửa','#','pnum','.pdf'],
['Cắt lề PDF','Cắt bớt viền trang','Chỉnh sửa','⌗','none','.pdf'],
['Biên tập lại (che thông tin)','Che vĩnh viễn nội dung nhạy cảm','Chỉnh sửa','█','none','.pdf'],
['Watermark PDF','Chèn chữ mờ lên mọi trang','Chỉnh sửa','◍','wm','.pdf'],
['Điền biểu mẫu PDF','Nhập vào các trường của biểu mẫu','Chỉnh sửa','▤','none','.pdf'],
['Chia sẻ PDF','Tạo liên kết chia sẻ tài liệu','Chỉnh sửa','↗','none','.pdf'],
['PDF sang QR','Tạo mã QR để tải và chia sẻ tài liệu','Chỉnh sửa','QR','qr','.pdf'],
['Ký tên vào PDF','Vẽ hoặc nhập chữ ký rồi chèn','Ký & Bảo vệ','✍','sign','.pdf'],
['Yêu cầu chữ ký','Gửi tài liệu cho người khác ký','Ký & Bảo vệ','✉','mail','.pdf'],
['Mở khóa PDF','Gỡ mật khẩu khỏi tệp','Ký & Bảo vệ','🔓','pass','.pdf'],
['Bảo vệ PDF','Đặt mật khẩu cho tệp','Ký & Bảo vệ','🔒','pass2','.pdf'],
['Làm phẳng PDF','Gộp chú thích và biểu mẫu vào trang','Ký & Bảo vệ','▭','none','.pdf'],
['Trò chuyện với PDF','Hỏi đáp về nội dung tài liệu','AI PDF','AI','chat','.pdf'],
['Tóm tắt PDF','Rút gọn tài liệu dài','AI PDF','Σ','none','.pdf'],
['Dịch PDF','Dịch tài liệu sang ngôn ngữ khác','AI PDF','文','lang2','.pdf'],
['Tạo câu hỏi','Sinh câu hỏi ôn tập từ tài liệu','AI PDF','?','none','.pdf'],
['Trình quét PDF','Chụp giấy tờ thành PDF','Quét','⎙','img','image/*']];
let cat='Tất cả',tool=null,files=[];
const cats=['Tất cả',...Object.keys(C)];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
function home(){const q=$('#q').value.trim().toLowerCase();
 $('#chips').innerHTML=cats.map(c=>`<button class="chip ${c==cat?'on':''}" data-c="${c}">${c}</button>`).join('');
 let h='';for(const c of Object.keys(C)){if(cat!='Tất cả'&&cat!=c)continue;
  const l=T.map((t,i)=>[t,i]).filter(([t])=>t[2]==c&&(t[0]+t[1]).toLowerCase().includes(q));if(!l.length)continue;
  h+=`<h2 class="cat">${c}</h2><div class="grid">`+l.map(([t,i])=>{
   const isSim = !['merge', 'range', 'rot', 'organize', 'qr'].includes(t[4]);
   const badge = isSim ? `<span style="font-size:10px; background:var(--line); color:var(--mute); padding:2px 6px; border-radius:4px; align-self:center">Sắp ra mắt</span>` : '';
   return `<button class="tool" data-i="${i}"><div class="ic" style="background:${C[c]}">${t[3]}</div><div style="flex:1"><b>${t[0]}</b><span>${t[1]}</span></div>${badge}</button>`;
  }).join('')+`</div>`}
 $('#tools').innerHTML=h||'<p style="color:var(--mute)">Không tìm thấy công cụ phù hợp. Thử từ khóa khác.</p>'}
$('#nav').innerHTML=['Nén','Chuyển đổi','Sắp xếp','Chỉnh sửa','Ký & Bảo vệ','AI PDF'].map(c=>`<button data-nav="${c}">${c}</button>`).join('');
const sz=b=>b>1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' KB';
const OPT={
 compress:`<label>Mức nén</label><div class="r"><label><input type="radio" name="lv" checked> Cơ bản (giữ chất lượng cao)</label><label><input type="radio" name="lv"> Mạnh (nhỏ nhất)</label></div>`,
 fmt:`<label>Định dạng đầu ra<select><option>Word (.docx)</option><option>Excel (.xlsx)</option><option>PowerPoint (.pptx)</option><option>JPG</option><option>PNG</option><option>PDF/A</option></select></label>`,
 lang:`<label>Ngôn ngữ trong tài liệu<select><option>Tiếng Việt</option><option>English</option><option>日本語</option></select></label>`,
 lang2:`<label>Dịch sang<select><option>Tiếng Việt</option><option>English</option><option>Français</option><option>中文</option></select></label>`,
 img:`<div class="r"><label>Khổ giấy<select><option>A4</option><option>Letter</option><option>Vừa với ảnh</option></select></label><label>Hướng<select><option>Dọc</option><option>Ngang</option></select></label></div>`,
 merge:`<label>Kéo bằng nút ↑ ↓ trong danh sách để đổi thứ tự tệp. Cần ít nhất 2 tệp.</label>`,
 range:`<label>Trang cần xử lý (ví dụ: 1-3, 5, 8-10)<input type="text" id="rg" placeholder="1-3, 5"></label>`,
 rot:`<div class="r"><label><input type="radio" name="r" checked> 90° phải</label><label><input type="radio" name="r"> 90° trái</label><label><input type="radio" name="r"> 180°</label></div>`,
 pnum:`<div class="r"><label>Vị trí<select><option>Giữa, dưới</option><option>Phải, dưới</option><option>Trái, dưới</option></select></label><label>Bắt đầu từ<input type="text" value="1" style="width:70px"></label></div>`,
 wm:`<label>Nội dung hình mờ<input type="text" value="BẢN NHÁP"></label><label>Độ mờ<input type="range" min="10" max="90" value="30"></label>`,
 pass:`<label>Mật khẩu hiện tại<input type="password" id="pw"></label>`,
 pass2:`<label>Mật khẩu mới<input type="password" id="pw"></label><label>Nhập lại mật khẩu<input type="password" id="pw2"></label>`,
 mail:`<label>Email người ký<input type="text" placeholder="ten@congty.vn"></label><label>Lời nhắn<input type="text" placeholder="Vui lòng ký trước thứ Sáu"></label>`,
 sign:`<label>Vẽ chữ ký của bạn</label><canvas id="cv" width="760" height="300"></canvas><div class="r"><button class="btn g" id="clr">Xóa chữ ký</button></div>`,
 chat:`<label>Câu hỏi về tài liệu<input type="text" placeholder="Ví dụ: Điều khoản thanh toán là gì?"></label>`,
 qr:`<label>Mã QR sẽ chứa liên kết tải tài liệu của bạn. Quá trình xử lý diễn ra bảo mật.</label>`,
 none:''};
function openTool(i){tool=T[i];files=[];$('#home').style.display='none';$('#ws').style.display='block';scrollTo(0,0);
 $('#wt').textContent=tool[0];$('#wd').textContent=tool[1];render()}
function render(){const k=tool[4], o=OPT[k]||'', multi=k=='merge'||tool[5].includes('image');
 let h='';
 if (k === 'compress') {
  h += `<div class="drop compress-drop" id="dz" style="border:2px dashed #ff4d4f; border-radius:16px; padding:60px 20px; background:#fff; position:relative;">
    <div style="font-size:64px; color:#ff4d4f; margin-bottom:20px; line-height:1; display:flex; justify-content:center;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><text x="6" y="16" font-size="5" font-family="sans-serif" font-weight="bold" fill="currentColor" stroke="none">PDF</text></svg>
    </div>
    <button class="btn" id="pick" style="background:#ff4d4f; padding:14px 32px; font-size:16px; font-weight:bold; border-radius:10px; margin-bottom:16px;">Chọn tệp PDF <span style="font-size:18px; margin-left:4px">+</span></button>
    <p style="color:var(--mute); margin:0 0 24px; font-size:14px">hoặc kéo thả tệp vào vùng này</p>
    <div style="display:flex; justify-content:center; gap:12px;">
      <button style="width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:#f8f9fa; display:grid; place-items:center; cursor:pointer" title="Google Drive"><svg width="20" height="20" viewBox="0 0 24 24" fill="#4285F4"><path d="M23.3 11.5c0-.8-.1-1.6-.2-2.3H12v4.4h6.4c-.3 1.4-1.1 2.6-2.2 3.4v2.8h3.5c2.1-1.9 3.3-4.8 3.3-8.3z"/><path fill="#34A853" d="M12 23c3.2 0 5.8-1.1 7.8-2.9l-3.5-2.8c-1.1.7-2.4 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.7H2.6v2.9C4.6 20.6 8 23 12 23z"/><path fill="#FBBC05" d="M5.7 13.5c-.2-.7-.4-1.4-.4-2.1s.1-1.4.4-2.1V6.4H2.6C1.6 8.3 1 10.5 1 12.8s.6 4.5 1.6 6.4l3.1-2.9z"/><path fill="#EA4335" d="M12 5.4c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.7 1.8 15.2.9 12 .9 8 .9 4.6 3.3 2.6 7l3.1 2.9c.9-2.7 3.4-4.5 6.3-4.5z"/></svg></button>
      <button style="width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:#f8f9fa; display:grid; place-items:center; cursor:pointer" title="Dropbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="#0061FF"><path d="M12 0L3.6 5.3 12 10.6l8.4-5.3L12 0zm0 11.3l-8.4 5.3L12 21.9l8.4-5.3-8.4-5.3zM3.6 15.9l8.4-5.3v10.6L3.6 15.9zM20.4 15.9l-8.4-5.3v10.6l8.4-5.3z"/></svg></button>
    </div>
    <input type="file" id="fi" hidden accept="${tool[5]}" ${multi?'multiple':''}>
  </div>`;
 } else {
  h=`<div class="drop" id="dz"><button class="btn" id="pick">Chọn tệp</button><p>hoặc kéo thả tệp vào đây (${tool[5].replace(/,/g,', ')})</p><input type="file" id="fi" hidden accept="${tool[5]}" ${multi?'multiple':''}></div>`;
 }
 if(files.length){h+=`<ul class="files">`+files.map((f,idx)=>`<li><span class="n">${f.name}</span><span class="s">${sz(f.size)}</span>${files.length>1?`<button data-m="${idx}:-1" aria-label="Lên">↑</button><button data-m="${idx}:1" aria-label="Xuống">↓</button>`:''}<button data-x="${idx}" aria-label="Xóa">✕</button></li>`).join('')+`</ul>`;
  if(o)h+=`<div class="opts">${o}</div>`;
  h+=`<button class="btn" id="go">${tool[0]}</button><div id="out"></div>`}
 $('#stage').innerHTML=h;
 const dz=$('#dz'),fi=$('#fi');$('#pick').onclick=()=>fi.click();fi.onchange=()=>add(fi.files);
 dz.ondragover=e=>{e.preventDefault();dz.classList.add('hov')};dz.ondragleave=()=>dz.classList.remove('hov');
 dz.ondrop=e=>{e.preventDefault();dz.classList.remove('hov');add(e.dataTransfer.files)};
 if($('#go'))$('#go').onclick=run;if($('#cv'))canvas();}
function add(fl){const m=tool[4]=='merge'||tool[5].includes('image');files=m?[...files,...fl]:[fl[0]];render()}
function canvas(){const c=$('#cv'),x=c.getContext('2d');x.lineWidth=4;x.lineCap='round';x.strokeStyle='#1b2a6b';let d=0;
 const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{d=1;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};
 c.onpointermove=e=>{if(d){x.lineTo(...p(e));x.stroke()}};c.onpointerup=()=>d=0;
 $('#clr').onclick=()=>x.clearRect(0,0,c.width,c.height)}
async function run(){
 const k=tool[4];
 if(k=='merge'&&files.length<2)return toast('Cần ít nhất 2 tệp để ghép');
 if(k=='range'&&!$('#rg').value.trim())return toast('Nhập khoảng trang cần xử lý');
 if(k=='pass2'&&(!$('#pw').value||$('#pw').value!=$('#pw2').value))return toast('Mật khẩu chưa khớp');
 if(k=='pass'&&!$('#pw').value)return toast('Nhập mật khẩu hiện tại');
 
 if(k=='organize'){
  if(typeof initOrganizer!=='function') return toast('Đang tải công cụ, vui lòng đợi...');
  $('#go').style.display='none';
  initOrganizer(files);
  return;
 }
 
 const b=$('#go');b.disabled=true;
 $('#out').innerHTML=`<div class="bar"><i id="pb"></i></div><span style="color:var(--mute);font-size:13px" id="st">Đang xử lý trên trình duyệt...</span>`;
 
 if(k=='compress') {
  try {
   const formData = new FormData();
   formData.append('file', files[0]);
   const r = document.querySelector('input[name="lv"]:checked');
   const lvl = r ? r.parentElement.textContent.trim() : 'Cơ bản';
   formData.append('level', lvl);
   
   $('#pb').style.width = '50%';
   const res = await fetch('http://localhost:8000/compress', {
     method: 'POST',
     body: formData
   });
   
   if(!res.ok) throw new Error("Backend không phản hồi");
   
   const blob = await res.blob();
   const url = URL.createObjectURL(blob);
   $('#pb').style.width = '100%';
   
   const originalSize = files[0].size;
   const newSize = blob.size;
   const saved = originalSize - newSize;
   const percentage = originalSize > 0 ? Math.max(0, Math.round((saved / originalSize) * 100)) : 0;
   
   $('#out').innerHTML=`<div class="res"><b>Hoàn tất.</b> Dung lượng giảm từ ${sz(originalSize)} còn ${sz(newSize)} (giảm ${percentage}%).<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="${url}" download="compressed_${files[0].name}">Tải xuống</a><button class="btn g" id="again">Xử lý tệp khác</button></div></div>`;
   $('#again').onclick=()=>{files=[];render()};
   b.disabled=false;
  } catch(e) {
   console.error(e);
   toast('Lỗi: Cần chạy Backend cục bộ tại port 8000 để sử dụng AI Nén PDF');
   $('#out').innerHTML='';
   b.disabled=false;
  }
  return;
 }

 if(k=='merge'||k=='range'||k=='rot'){
  try {
   const { PDFDocument } = window.PDFLib;
   let resultPdf = await PDFDocument.create();
   
   if(k=='merge') {
    for(let f of files) {
     const doc = await PDFDocument.load(await f.arrayBuffer());
     const pages = await resultPdf.copyPages(doc, doc.getPageIndices());
     pages.forEach(p => resultPdf.addPage(p));
    }
   } else if(k=='rot') {
    const doc = await PDFDocument.load(await files[0].arrayBuffer());
    const r = $('input[name="r"]:checked');
    const angleText = r ? r.nextSibling.textContent.trim() : '90° phải';
    let angle = 90;
    if(angleText.includes('trái')) angle = -90;
    else if(angleText.includes('180')) angle = 180;
    
    doc.getPages().forEach(p => {
     p.setRotation(window.PDFLib.degrees(p.getRotation().angle + angle));
    });
    resultPdf = doc;
   } else if(k=='range') {
    const doc = await PDFDocument.load(await files[0].arrayBuffer());
    const val = $('#rg').value.replace(/ /g,'').split(',');
    const pagesToProcess = new Set();
    for(let v of val) {
     if(v.includes('-')) {
      let [s, e] = v.split('-').map(Number);
      for(let i=s; i<=e; i++) pagesToProcess.add(i);
     } else pagesToProcess.add(Number(v));
    }
    const isDelete = tool[0].includes('Xóa');
    const indicesToCopy = [];
    doc.getPageIndices().forEach(i => {
     const pageNum = i + 1;
     if((!isDelete && pagesToProcess.has(pageNum)) || (isDelete && !pagesToProcess.has(pageNum))) {
      indicesToCopy.push(i);
     }
    });
    if(indicesToCopy.length === 0) throw new Error("Không còn trang nào sau khi xử lý");
    const copied = await resultPdf.copyPages(doc, indicesToCopy);
    copied.forEach(p => resultPdf.addPage(p));
   }
   
   $('#pb').style.width = '80%';
   const pdfBytes = await resultPdf.save();
   const blob = new Blob([pdfBytes], {type: 'application/pdf'});
   const url = URL.createObjectURL(blob);
   
   $('#pb').style.width = '100%';
   $('#out').innerHTML=`<div class="res"><b>Hoàn tất.</b> <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="${url}" download="processed.pdf">Tải xuống</a><button class="btn g" id="again">Xử lý tệp khác</button></div></div>`;
   $('#again').onclick=()=>{files=[];render()};
   b.disabled=false;
  } catch(e) {
   toast('Lỗi: '+e.message);$('#out').innerHTML='';b.disabled=false;
  }
  return;
 }
 
 if(k=='qr'){
  $('#st').textContent = 'Đang tải tệp lên máy chủ bảo mật...';
  let progress = 0;
  const pBar = $('#pb');
  const timer = setInterval(() => {
   progress += 20;
   pBar.style.width = progress + '%';
   if(progress >= 100) {
    clearInterval(timer);
    const file = files[0];
    const blobUrl = URL.createObjectURL(file);
    const fileName = file.name;
    const fakeUrl = "https://pdfhub.local/share/doc_" + Math.random().toString(36).substring(2, 9);
    
    $('#out').innerHTML = `<div class="res" style="text-align:center;"><b>Tạo mã QR thành công!</b><p style="color:var(--mute); font-size:13px; margin-bottom:12px;">(Lưu ý: Ứng dụng chưa có máy chủ để lưu file online. Nút bên dưới sẽ tải file trực tiếp trên trình duyệt này)</p><div id="qr-code" style="display:flex;justify-content:center;margin:16px 0;background:#fff;padding:16px;border-radius:12px;border:1px solid var(--line);width:max-content;margin-inline:auto;"></div><div style="background:var(--bg);padding:8px 12px;border-radius:6px;display:inline-block;border:1px solid var(--line);"><a href="${blobUrl}" download="shared_${fileName}" style="color:var(--acc);word-break:break-all;font-size:14px;text-decoration:none;font-weight:500;">⬇ Nhấn vào đây để tải tệp xuống (${fileName})</a></div><div style="margin-top:20px;display:flex;gap:8px;justify-content:center;"><button class="btn g" id="again">Tạo mã khác</button></div></div>`;
    const renderQR = () => new QRCode(document.getElementById("qr-code"), { text: fakeUrl, width: 180, height: 180, colorDark: "#1a1f36", colorLight: "#ffffff" });
    if (typeof QRCode === 'undefined') {
     const script = document.createElement('script');
     script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
     script.onload = renderQR;
     document.head.appendChild(script);
    } else { renderQR(); }
    $('#again').onclick=()=>{files=[];render()};
    b.disabled=false;
   }
  }, 400);
  return;
 }
 
 if(!['merge', 'range', 'rot', 'organize', 'qr'].includes(k)) {
  $('#out').innerHTML=`<div class="res"><b>Tính năng sắp ra mắt</b><p style="margin:4px 0 0;font-size:13px;color:var(--mute)">Công cụ này đang được phát triển và sẽ sớm có mặt. Xin cảm ơn!</p></div>`;
  b.disabled=false;
  return;
 }
}
function done(){const tot=files.reduce((a,f)=>a+f.size,0),k=tool[4];
 const extra=k=='compress'?`Dung lượng giảm từ ${sz(tot)} còn khoảng ${sz(tot*.42)} (ước tính mô phỏng).`:`${files.length} tệp đã được xử lý.`;
 $('#out').innerHTML=`<div class="res"><b>Hoàn tất.</b> ${extra}<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="dl">Tải xuống</button><button class="btn g" id="again">Xử lý tệp khác</button></div></div>`;
 $('#dl').onclick=()=>toast('Đây là giao diện mẫu, chưa tạo tệp thật');$('#again').onclick=()=>{files=[];render()};$('#go').disabled=false}
function back(){$('#ws').style.display='none';$('#home').style.display='block';home()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.c){cat=b.dataset.c;home()}
 if(b.dataset.nav){back();cat=b.dataset.nav;home();$('#tools').scrollIntoView()}
 if(b.dataset.i!=null&&b.classList.contains('tool'))openTool(+b.dataset.i);
 if(b.dataset.x!=null){files.splice(+b.dataset.x,1);render()}
 if(b.dataset.m){const[k,d]=b.dataset.m.split(':').map(Number),j=k+d;if(files[j]){[files[k],files[j]]=[files[j],files[k]];render()}}
 if(b.id=='logo'||b.id=='back'){cat='Tất cả';back()}
 if(b.id=='theme'){const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()=='#0f1220';r.dataset.theme=dk?'light':'dark'}
 if(b.id=='refresh-app')location.reload()});
$('#q').oninput=home;home();
</script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="organizer.js?v=29"></script>
</body>

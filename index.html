<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bộ công cụ PDF trực tuyến</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1a1f36;--mute:#667085;--line:#e1e5ee;--acc:#e8453c;--accs:#fdeceb;--navy:#1a1f36;--ok:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c2f;--ink:#eceef8;--mute:#9aa1bd;--line:#2a3050;--acc:#ff6a61;--accs:#3a1f27;--navy:#090b16}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c2f;--ink:#eceef8;--mute:#9aa1bd;--line:#2a3050;--acc:#ff6a61;--accs:#3a1f27;--navy:#090b16}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:20px;padding:12px 5vw;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .logo{font-weight:800;font-size:19px;cursor:pointer;background:none;border:0;color:#fff;padding:0}
header nav{display:flex;gap:4px;flex:1;overflow-x:auto}
header nav button{background:none;border:0;color:#cfd3e6;padding:6px 10px;border-radius:6px;white-space:nowrap}header nav button:hover{background:#ffffff1a;color:#fff}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;background:var(--acc);color:#fff}.btn:hover{filter:brightness(1.08)}
.btn.g{background:none;border:1px solid var(--line);color:var(--ink)}
.hero{padding:56px 5vw 28px;max-width:1100px;margin:auto}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.12;margin:0 0 12px;max-width:16ch}
.hero p{color:var(--mute);margin:0 0 20px;max-width:56ch}
.search{display:flex;gap:8px;max-width:520px}.search input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.wrap{max-width:1100px;margin:auto;padding:0 5vw 48px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 20px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;color:var(--mute)}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2.cat{font-size:16px;margin:26px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;display:flex;gap:12px;align-items:flex-start}
.tool:hover{border-color:var(--acc)}
.ic{flex:none;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px}
.tool b{display:block;font-size:14px}.tool span{color:var(--mute);font-size:13px;line-height:1.35;display:block}
.band{background:var(--card);border-block:1px solid var(--line);padding:32px 5vw}
.band .in{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.band h3{margin:0 0 4px;font-size:15px}.band p{margin:0;color:var(--mute);font-size:13px}
.plans{max-width:1100px;margin:auto;padding:36px 5vw;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.plan{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:18px}.plan h3{margin:0}.plan ul{padding-left:18px;color:var(--mute);margin:10px 0 0}
footer{padding:24px 5vw;color:var(--mute);font-size:13px;text-align:center}
/* workspace */
#ws{display:none;max-width:860px;margin:auto;padding:28px 5vw 48px}
.back{background:none;border:0;color:var(--mute);padding:0;margin-bottom:12px}
#ws h1{margin:0 0 4px;font-size:28px}#ws .d{color:var(--mute);margin:0 0 18px}
.drop{border:2px dashed var(--line);border-radius:12px;background:var(--card);padding:40px 20px;text-align:center}
.drop.hov{border-color:var(--acc);background:var(--accs)}.drop p{margin:8px 0 0;color:var(--mute);font-size:13px}
.files{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.files li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.files .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.files .s{color:var(--mute);font-size:12px}
.files button{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.opts{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0;display:grid;gap:12px}
.opts label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.opts input[type=text],.opts input[type=password],.opts select{padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.opts .r{display:flex;gap:14px;flex-wrap:wrap}.opts .r label{display:flex;gap:6px;align-items:center;color:var(--ink)}
canvas{width:100%;height:150px;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 6px}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
.res{background:var(--card);border:1px solid var(--ok);border-radius:10px;padding:16px;margin-top:14px}
.res b{color:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <button class="logo" id="logo">PDF Editor</button>
  <div style="flex:1"></div>
  <button class="btn g" id="theme" style="color:#fff;border-color:#ffffff40">◐</button>
  <button class="btn" id="refresh-app" style="background:#4a5568">Làm mới</button>
</header>

<main id="home">
  <section class="hero" style="padding-bottom:20px;text-align:center;">
    <h1>Trình Chỉnh Sửa PDF</h1>
    <p>Nén, gộp, cắt, chỉnh sửa nội dung tài liệu chuyên nghiệp.</p>
  </section>
  <div class="wrap"><div id="tools" style="max-width: 400px; margin: auto;"></div></div>
</main>

<main id="ws">
  <button class="back" id="back">← Tất cả công cụ</button>
  <h1 id="wt"></h1><p class="d" id="wd"></p>
  <div id="stage"></div>
</main>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),C={'Chỉnh sửa':'#0f9d8a'};
const T=[
['Chỉnh sửa PDF','Đọc, Xoay, Xóa, Sắp xếp, Chèn trang, Thêm chữ, Trích xuất, Gộp file PDF chuyên nghiệp.','Chỉnh sửa','✎','organize','.pdf']
];
let cat='Tất cả',tool=null,files=[];
const cats=['Tất cả',...Object.keys(C)];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}

function home(){
 $('#chips').innerHTML='';
 let h=`<h2 class="cat">Chỉnh sửa PDF</h2><div class="grid"><button class="tool" data-i="0"><div class="ic" style="background:#0f9d8a">✎</div><div style="flex:1"><b>Chỉnh sửa PDF</b><span>Đọc, Xoay, Xóa, Sắp xếp, Chèn trang, Thêm chữ, Trích xuất, Gộp file PDF chuyên nghiệp.</span></div></button></div>`;
 $('#tools').innerHTML=h;
}

const sz=b=>b>1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' KB';

function openTool(i){tool=T[i];files=[];$('#home').style.display='none';$('#ws').style.display='block';scrollTo(0,0);
 $('#wt').textContent=tool[0];$('#wd').textContent='';render()}

function render(){
 let h=`<div class="drop" id="dz"><button class="btn" id="pick">Chọn tệp</button><p>hoặc kéo thả tệp vào đây (${tool[5]})</p><input type="file" id="fi" hidden accept="${tool[5]}" multiple></div>`;
 if(files.length){h+=`<ul class="files">`+files.map((f,k)=>`<li><span class="n">${f.name}</span><span class="s">${sz(f.size)}</span>${files.length>1?`<button data-m="${k}:-1" aria-label="Lên">↑</button><button data-m="${k}:1" aria-label="Xuống">↓</button>`:''}<button data-x="${k}" aria-label="Xóa">✕</button></li>`).join('')+`</ul>`;
  h+=`<button class="btn" id="go">Mở Trình Chỉnh Sửa</button><div id="out"></div>`}
 $('#stage').innerHTML=h;
 const dz=$('#dz'),fi=$('#fi');$('#pick').onclick=()=>fi.click();fi.onchange=()=>add(fi.files);
 dz.ondragover=e=>{e.preventDefault();dz.classList.add('hov')};dz.ondragleave=()=>dz.classList.remove('hov');
 dz.ondrop=e=>{e.preventDefault();dz.classList.remove('hov');add(e.dataTransfer.files)};
 if($('#go'))$('#go').onclick=run;}

function add(fl){files=[...files,...fl];render()}

async function run(){
 if(typeof initOrganizer!=='function') return toast('Đang tải công cụ, vui lòng đợi...');
 $('#go').style.display='none';
 initOrganizer(files);
}

function back(){$('#ws').style.display='none';$('#home').style.display='block';home()}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.i!=null&&b.classList.contains('tool'))openTool(+b.dataset.i);
 if(b.dataset.x!=null){files.splice(+b.dataset.x,1);render()}
 if(b.dataset.m){const[k,d]=b.dataset.m.split(':').map(Number),j=k+d;if(files[j]){[files[k],files[j]]=[files[j],files[k]];render()}}
 if(b.id=='logo'||b.id=='back'){back()}
 if(b.id=='theme'){const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()=='#0f1220';r.dataset.theme=dk?'light':'dark'}
 if(b.id=='refresh-app')location.reload()});

home();
</script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="organizer.js?v=18"></script>
</body>
</html>
